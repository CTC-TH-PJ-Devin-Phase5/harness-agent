# EC2 g5.4xlarge — NVIDIA A10G (24 GB VRAM), 16 vCPU, 64 GB RAM
#
# Model: qwen3:32b (dense 32B, hybrid thinking/non-thinking mode)
#   VRAM: ~20 GB at Q4_K_M — leaves ~4 GB headroom for 32K KV cache
#   Speed: ~15-25 t/s on A10G
#   HumanEval: ~95% in think mode — top coding benchmark for local models
#   Context: 32K safe (Q4_K_M model ~20 GB + KV ~4 GB = ~24 GB, fits A10G)
#   Think mode: supported natively — enabled via OLLAMA_THINK=true in config
#
# Usage:
#   docker compose -f harness/local-execute/docker-compose.dev.yml up -d
#
# First run pulls qwen3:32b (~20 GB) and creates the harness-coder model.
# After that, model is cached in the /data/ollama volume.
#
# Set in harness/local-execute/.env:
#   OLLAMA_MODEL=harness-coder

services:
  ollama:
    image: ollama/ollama:latest
    container_name: harness-ollama
    restart: unless-stopped

    # ── GPU ──────────────────────────────────────────────────────────────────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # ── Ports ─────────────────────────────────────────────────────────────────
    ports:
      - "127.0.0.1:11434:11434"

    # ── Volumes ───────────────────────────────────────────────────────────────
    volumes:
      # Docker named volume — stored on EBS root, persists across EC2 stop/start
      - ollama-models:/root/.ollama
      - ./ollama/config:/etc/ollama     # config.json (gpu_layers, mlock, mmap)

    # ── Environment ───────────────────────────────────────────────────────────
    environment:
      # --- GPU / CUDA ---
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_NUM_GPU: "1"               # A10G = 1 GPU

      # --- Memory ---
      # 0.92 × 24 GB = 22 GB for model + KV; leaves ~2 GB for CUDA overhead
      OLLAMA_GPU_MEMORY_FRACTION: "0.92"

      # --- Concurrency ---
      # harness runs sequential (1 ticket at a time) → 1 parallel slot
      # saves VRAM for larger context window
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "4"

      # --- Context & batching ---
      # 32K: safe on A10G with qwen3:32b Q4_K_M
      # model ~20 GB + KV cache 32K q8_0 ~4 GB = ~24 GB (tight but fits)
      OLLAMA_NUM_CTX: "32768"
      OLLAMA_NUM_BATCH: "512"

      # --- CPU threads (for non-GPU ops: tokenise, sample) ---
      # g5.4xlarge has 16 vCPU; 12 threads leaves headroom for OS + Docker
      OLLAMA_NUM_THREAD: "12"

      # --- KV cache ---
      OLLAMA_FLASH_ATTENTION: "1"       # major speedup on NVIDIA GPU
      OLLAMA_KV_CACHE_TYPE: "q8_0"      # halves KV VRAM → more room for context

      # --- Model lifecycle ---
      # keep model loaded between Phase 4a tool-use turns
      # without this the model unloads between calls and each turn pays load cost
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_LOADED_MODELS: "1"

      # --- Network ---
      OLLAMA_HOST: 0.0.0.0:11434

      # --- Logging ---
      OLLAMA_DEBUG: "0"

    # ── Kernel / IPC ──────────────────────────────────────────────────────────
    ipc: host                           # faster CUDA IPC
    shm_size: "8gb"                     # shared memory for CUDA kernels

    # ── Resource limits ───────────────────────────────────────────────────────
    ulimits:
      memlock: -1                       # required for GPU pinned memory
      stack: 67108864                   # 64 MB stack

    # ── Health check ──────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s                 # GPU model load needs more time

    # ── Logging ───────────────────────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Model initialiser ─────────────────────────────────────────────────────
  # Runs once after ollama is healthy:
  #   1. Pull base model from Ollama registry (~20 GB, first run only)
  #   2. Create harness-coder model from Modelfile (bakes in sampling params
  #      and the Phase 4a system prompt)
  # Subsequent runs skip the pull (model is cached in ollama-models volume).
  model-init:
    image: ollama/ollama:latest
    container_name: harness-model-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./ollama:/ollama-config         # mounts Modelfile
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - sh
      - -c
      - |
        echo ">>> Pulling qwen3:32b ..."
        ollama pull qwen3:32b
        echo ">>> Creating harness-coder model from Modelfile ..."
        ollama create harness-coder -f /ollama-config/Modelfile
        echo ">>> Done. Available models:"
        ollama list

volumes:
  ollama-models:
    driver: local  # stored in /var/lib/docker/volumes/ on EBS root — persists across EC2 stop/start
